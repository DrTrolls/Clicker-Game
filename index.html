<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie-Style Image Clicker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-layout">
    <section class="play-panel">
      <header>
        <h1>Cookie-Style Image Clicker</h1>
        <p class="score-label">Points: <span id="points">0</span></p>
        <p class="score-label">Per Click: <span id="per-click">1</span> · Auto / Sec: <span id="auto-rate">0</span></p>
        <p class="score-label">Manual Multiplier: <span id="manual-mult">1x</span> · Auto Multiplier: <span id="auto-mult">1x</span></p>
      </header>

      <section class="click-area">
        <button id="click-target" class="image-button" aria-label="Click to earn points">
          <img id="center-image" src="https://images.unsplash.com/photo-1502741338009-cac2772e18bc?auto=format&fit=crop&w=500&q=80" alt="Main click target" />
        </button>
      </section>
    </section>

    <aside class="upgrades-panel">
      <div class="upgrade-column">
        <h2>Manual Click Upgrades</h2>
        <div id="manual-upgrades"></div>
      </div>

      <div class="upgrade-column">
        <h2>Automatic Click Upgrades</h2>
        <div id="auto-upgrades"></div>
      </div>

      <div class="upgrade-column">
        <h2>One-Time Multipliers</h2>
        <div id="multiplier-upgrades"></div>
      </div>

      <div class="upgrade-column">
        <h2>Image Shop</h2>
        <p class="small">Buy new clicker skins. Each one costs more than the last.</p>
        <div id="image-shop"></div>
      </div>

      <div class="upgrade-column">
        <h2>Owned Images</h2>
        <p class="small">Swap anytime after purchase.</p>
        <div id="owned-images"></div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
